[project]
name = "order-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "boto3>=1.44.9",
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
]

[project.scripts]
order-service = "order_service:main"
list-s3-buckets = "order_service.list_s3_buckets:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
